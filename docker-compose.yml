version: "3.9"

services:
  backend:
    build: ./backend
    container_name: verafide-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-long-random-string}
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - DATABASE_URL=sqlite:///./app.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost
    volumes:
      - backend_data:/app/data_store
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: verafide-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
