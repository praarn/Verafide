services:
  db:
    image: postgres:16-alpine
    container_name: verafide-db
    environment:
      POSTGRES_USER: verafide
      POSTGRES_PASSWORD: verafide
      POSTGRES_DB: verafide
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verafide -d verafide"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: verafide-backend
    ports:
      - "8000:8000"
    environment:
      ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-long-random-string}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 14
      DATABASE_URL: postgresql+psycopg://verafide:verafide@db:5432/verafide
      DB_CREATE_ALL: "false"
      CORS_ORIGINS: http://localhost:3000,http://localhost
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      RAG_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the built /api/* rewrite — the browser hits :3000 and
        # the Next server proxies to the backend container.
        BACKEND_ORIGIN: http://backend:8000
        # Browser-side WebSocket target for batch progress. localhost works
        # when the stack runs on the user's machine; override for a remote host.
        NEXT_PUBLIC_WS_ORIGIN: ws://localhost:8000
    container_name: verafide-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_ORIGIN: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
