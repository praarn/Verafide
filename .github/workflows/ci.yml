name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verafide
          POSTGRES_PASSWORD: verafide
          POSTGRES_DB: verafide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verafide"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Alembic migrations apply on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://verafide:verafide@localhost:5432/verafide
        run: |
          alembic upgrade head
          alembic downgrade base

      - name: Build ML models + RAG index
        run: python scripts/train_models.py && python scripts/build_rag_index.py

      - name: Tests (pytest, SQLite)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
